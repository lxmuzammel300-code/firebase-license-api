
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SK License API Tester</title>
  <style>
    body {
      background: #10131c;
      color: white;
      font-family: Arial, sans-serif;
      padding: 25px;
    }
    .box {
      max-width: 420px;
      margin: 50px auto;
      background: #1d2433;
      padding: 25px;
      border-radius: 15px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border-radius: 8px;
      border: none;
    }
    input { background: #30394b; color: white; }
    button {
      background: #00c9a7;
      color: #071b19;
      font-weight: bold;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #10131c;
      padding: 12px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>SK LICENSE TESTER</h2>
  <p>Firebase License Verification</p>

  <input id="licenseKey"
    placeholder="Enter License Key"
    value="TEST-LICENSE-001">

  <button id="verify">VERIFY LICENSE</button>

  <pre id="result">Waiting...</pre>
</div>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getAuth,
  signInAnonymously
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAUaPvssaqBzFWxucjaS40hRWLOP6M5ilQ",
  authDomain: "sk-mod-abe0f.firebaseapp.com",
  projectId: "sk-mod-abe0f",
  storageBucket: "sk-mod-abe0f.firebasestorage.app",
  messagingSenderId: "750831636150",
  appId: "1:750831636150:web:e5e7eb744b64275d922017",
  measurementId: "G-896LBK1B7Q"
};

const API_URL =
  "https://cool-centaur-34bbe4.netlify.app/api/verify-license";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const result = document.getElementById("result");
const button = document.getElementById("verify");

button.addEventListener("click", async () => {
  button.disabled = true;
  result.textContent = "Checking license...";

  try {
    const credential = await signInAnonymously(auth);
    const token = await credential.user.getIdToken();

    const licenseKey =
      document.getElementById("licenseKey").value.trim();

    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify({ licenseKey })
    });

    const data = await response.json();

    result.textContent = JSON.stringify({
      httpStatus: response.status,
      ...data
    }, null, 2);

  } catch (error) {
    result.textContent = "ERROR: " + error.message;
  } finally {
    button.disabled = false;
  }
});
</script>

</body>
    </html>
